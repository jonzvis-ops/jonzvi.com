name: Build site & copy images from Wix

# 1) Generates all HTML pages from _src/ (text + image lists live in _src/data.py)
# 2) Downloads any image / PDF listed in assets/manifest.txt that isn't in the repo yet
# 3) Commits the result, and GitHub Pages publishes it.
on:
  push:
    branches: [main]
    paths: ["_src/**", ".github/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Generate pages
        run: python3 _src/build.py
      - name: Download missing images and resume
        run: python3 .github/scripts/fetch_assets.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Build site and copy assets from the old Wix site"
            git push
          fi
